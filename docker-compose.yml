services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ravex
      POSTGRES_PASSWORD: ravex_dev
      POSTGRES_DB: ravex
    ports:
      - "5432:5432"
    volumes:
      - ravex_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravex"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ravex_postgres:

